task_plot_spec:
  spec_version: '0.2'
  meta:
    task_name: Two-Armed Bandit Task
    mode: existing
    task_id: T000038
  figure:
    output:
      filename: task_flow.png
      dpi: 300
      width_in: 16.0
      background: white
    layout:
      max_conditions: 4
      screens_per_timeline: 6
      screen_overlap_ratio: 0.1
      screen_slope: 0.08
      screen_slope_deg: 25.0
      timeline_gap: 0.18
      screen_aspect_ratio: 1.4545454545454546
      left_margin: 0.2
      right_margin: 0.03
      top_margin: 0.03
      bottom_margin: 0.05
      condition_label_gap: 0.014
      phase_label_pad: 0.01
      duration_label_gap: 0.006
      timeline_arrow_gap: 0.01
      timeline_arrow_screen_clearance: 0.007
      timeline_arrow_text_clearance: 0.01
      timeline_arrow_extra_per_screen: 0.015
      timeline_arrow_min_y: 0.02
      timeline_arrow_max_y: 0.96
  timelines:
  - condition: bandit
    display_condition_label: Two-Armed Bandit
    phases:
    - phase_name: pre choice fixation
      display_phase_label: Fixation
      duration_ms:
        fixed: 500
      response_window_ms: null
      display_timing_label: 500 ms
      stim_ids:
      - fixation
      stimulus_example:
        summary: +
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: +
          color: white
          pos: null
          height: 44.0
      notes: ''
    - phase_name: bandit choice
      display_phase_label: Bandit Choice
      duration_ms:
        fixed: 2500
      response_window_ms:
        fixed: 2500
      display_timing_label: 2500 ms
      stim_ids:
      - machine_left
      - machine_right
      - machine_left_label
      - machine_right_label
      - choice_prompt
      stimulus_example:
        summary: Left and right machines with response prompt
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: Left Machine
          color: white
          pos:
          - -185.0
          - 45.0
          height: 26.0
        - kind: text
          text: Right Machine
          color: white
          pos:
          - 185.0
          - 45.0
          height: 26.0
        - kind: text
          text: Please choose a machine
          color: white
          pos:
          - 0.0
          - -10.0
          height: 28.0
        - kind: text
          text: Respond within 2500 ms
          color: '#EEEEEE'
          pos:
          - 0.0
          - -60.0
          height: 24.0
      notes: Representative left/right machine labels and response deadline prompt.
    - phase_name: choice confirmation
      display_phase_label: Choice Confirmation
      duration_ms:
        fixed: 400
      response_window_ms: null
      display_timing_label: 400 ms
      stim_ids:
      - machine_left
      - machine_right
      - machine_left_label
      - machine_right_label
      - highlight_left
      - highlight_right
      - target_prompt
      stimulus_example:
        summary: 'You selected: Left Machine'
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: 'You selected: Left Machine'
          color: cyan
          pos:
          - 0.0
          - 8.0
          height: 28.0
        - kind: text
          text: Selection confirmation with highlighted choice
          color: '#D1D5DB'
          pos:
          - 0.0
          - -38.0
          height: 20.0
      notes: Representative confirmation text; real task highlights the selected option.
    - phase_name: outcome feedback
      display_phase_label: Feedback
      duration_ms:
        fixed: 800
      response_window_ms: null
      display_timing_label: 800 ms
      stim_ids:
      - feedback_win
      - feedback_loss
      stimulus_example:
        summary: 'Win! +10 points / Current total: 1010'
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: Win! +10 points
          color: green
          pos:
          - 0.0
          - 20.0
          height: 30.0
        - kind: text
          text: 'Current total: 1010'
          color: green
          pos:
          - 0.0
          - -25.0
          height: 26.0
      notes: Representative win-state feedback; loss-state branch uses the same layout
        with loss wording.
    - phase_name: iti
      display_phase_label: ITI
      duration_ms:
        fixed: 600
      response_window_ms: null
      display_timing_label: 600 ms
      stim_ids:
      - fixation
      stimulus_example:
        summary: +
        modality: visual
        draw_hint: text
        render_items:
        - kind: text
          text: +
          color: white
          pos: null
          height: 44.0
      notes: ''
    display_condition_note: binary-choice reward learning
  legend: []
